<style>
    .mobile-link {
        display: block;
        width: 100%;
        padding: 12px 10px;
        color: #facc15;
        text-decoration: none;
        font-size: 17px;
        font-weight: 600;
        border-radius: 6px;
        transition: 0.2s;
    }

    .mobile-link:hover {
        background: rgba(250, 204, 21, 0.15);
        color: white;
    }

    .mobile-sublink {
        display: block;
        padding: 9px 8px;
        color: #facc15;
        text-decoration: none;
        font-size: 14px;
        border-radius: 5px;
        transition: 0.2s;
    }

    .mobile-sublink:hover {
        background: rgba(250, 204, 21, 0.15);
        color: white;
    }
</style>


<!-- MOBILE MENU JAVASCRIPT -->
<script>
    const mobileMenuBtn = document.getElementById("mobile-menu-btn");
    const mobileMenu = document.getElementById("mobile-menu");

    const heroesBtn = document.getElementById("mobile-heroes-btn");
    const heroesMenu = document.getElementById("mobile-heroes");
    const heroesArrow = document.getElementById("heroes-arrow");

    const universeBtn = document.getElementById("mobile-universe-btn");
    const universeMenu = document.getElementById("mobile-universe");
    const universeArrow = document.getElementById("universe-arrow");


    // Головне меню
    mobileMenuBtn.addEventListener("click", () => {

        mobileMenu.classList.toggle("hidden");

        const isOpen = !mobileMenu.classList.contains("hidden");

        mobileMenuBtn.setAttribute("aria-expanded", isOpen);

        mobileMenuBtn.textContent = isOpen ? "✕" : "☰";
    });


    // ГЕРОЇ
    heroesBtn.addEventListener("click", () => {

        heroesMenu.classList.toggle("hidden");

        heroesArrow.textContent =
            heroesMenu.classList.contains("hidden") ? "▾" : "▴";
    });


    // ВСЕСВІТ
    universeBtn.addEventListener("click", () => {

        universeMenu.classList.toggle("hidden");

        universeArrow.textContent =
            universeMenu.classList.contains("hidden") ? "▾" : "▴";
    });
</script>
